name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Get version from build.gradle.kts
        id: get_version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
          BUILD_NUMBER=$(grep 'versionCode = ' app/build.gradle.kts | sed 's/.*versionCode = \([0-9]*\).*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Fetch Frida 16.x injector (arm64) into res/raw
        run: |
          # Frida 17 removeu o bridge global `Java` (virou módulo externo). Usamos
          # 16.7.19, onde Java.perform/Java.use funcionam em scripts injetados crus.
          FV=16.7.19
          BASE="https://github.com/frida/frida/releases/download/${FV}"
          # So o frida-inject: com `-D local` ele injeta sozinho, sem frida-server.
          curl -fL -o fi.xz "${BASE}/frida-inject-${FV}-android-arm64.xz"
          xz -d fi.xz
          # Desliga a recarga da politica do SELinux (mesmo patch do haval-climate-control).
          # A cada start, o Frida le /sys/fs/selinux/policy, acrescenta as regras dele e
          # grava tudo de volta em /sys/fs/selinux/load — um reload da politica inteira
          # que, no boot, derrubava o system_server da central. frida_selinux_patch_policy()
          # sai calado quando o arquivo da politica nao existe, entao basta apontar os
          # dois caminhos para nomes inexistentes (mesmo tamanho, com o \0 junto para nao
          # pegar prefixo). O app roda setenforce 0 antes de injetar, e o setfilecon para
          # frida_file que falha por falta do tipo e ignorado pelo Frida.
          perl -0777 -pi -e '$n = s{/sys/fs/selinux/policy\0}{/sys/fs/selinux/policX\0}g; $m = s{/sys/fs/selinux/load\0}{/sys/fs/selinux/loaX\0}g; die "patch SELinux: policy=$n load=$m (esperado 1 e 1)\n" unless $n == 1 && $m == 1' fi
          if grep -a -q -e '/sys/fs/selinux/policy' -e '/sys/fs/selinux/load' fi; then
            echo "patch SELinux nao pegou"; exit 1
          fi
          mv fi app/src/main/res/raw/fridainject
          chmod 644 app/src/main/res/raw/fridainject
          ls -la app/src/main/res/raw/fridainject

      - name: Decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: haval-engine-reverse-${{ steps.get_version.outputs.VERSION }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
